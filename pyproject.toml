[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[project]
name = "backlog-service"
version = "0.3.0"
description = "Historias priorizadas e progresso por projeto - MVP de Igor"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1", "uvicorn>=0.30,<1", "sqlalchemy>=2.0,<2.2",
  "psycopg[binary]>=3.2,<4", "pyjwt[crypto]>=2.10,<3",
  "pydantic-settings>=2.6,<3", "httpx>=0.27,<1", "certifi",
]

[dependency-groups]
dev = ["pytest>=8.3,<10", "ruff>=0.8,<1", "mypy>=1.13,<2", "hatchling>=1.27,<2", "editables>=0.5,<1"]

[project.scripts]
backlog-service = "backlog_service.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/backlog_service"]

[tool.hatch.build]
exclude = ["**/AGENTS.md", "**/agents.md", "**/.env*", "**/keys/**", "**/*.pem", "**/*.db", "**/*.sqlite*", "**/.local/**", "**/.superpowers/**", "**/superpowers/**", "**/.worktrees/**", "**/__pycache__/**", "**/*.pyc"]

[tool.hatch.build.targets.sdist]
include = ["/src", "/tests", "/docs/integration.md", "/docs/database-neon.md", "/docs/deploy-azure.md", "/docs/verification.md", "/README.md", "/CHANGELOG.md", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore"]

[tool.hatch.build.targets.sdist.force-include]
".env.example" = ".env.example"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
target-version = "py312"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]

[tool.mypy]
strict = true
plugins = ["pydantic.mypy"]
files = ["src/backlog_service"]
